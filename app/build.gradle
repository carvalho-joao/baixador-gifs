plugins {
    id 'com.android.application'
}

// Assinatura: se existir app/release.jks (criado pelo GitHub Actions a partir dos
// secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD), usa essa chave; senão usa a chave de debug.
def releaseKs = file('release.jks')

android {
    namespace 'com.baixadorgifs.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.baixadorgifs.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }

    signingConfigs {
        release {
            if (releaseKs.exists()) {
                storeFile releaseKs
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'baixador'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKs.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
