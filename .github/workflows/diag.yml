name: Diagnostico CORS
on:
  push:
    paths: ['.github/workflows/diag.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://carvalho-joao.github.io"
          curl -s -D - -o /tmp/p.json -H "$O" "https://api.fxtwitter.com/2/status/700002208306171904" | grep -iE "^HTTP|access-control"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p.json')); s=d.get('status') or {}
          print('TEXT', (s.get('text') or '')[:80])
          m=s.get('media') or {}
          print('KEYS', list(m.keys()))
          for v in m.get('videos',[]): print('VIDEO', v.get('type'), v.get('width'), v.get('height'), v.get('duration'), v.get('url')); print('FORMATS', [(f.get('container'),f.get('codec'),f.get('bitrate')) for f in v.get('formats',[])])
          for p in m.get('photos',[]): print('PHOTO', p.get('type'), p.get('url'))
          open('/tmp/u','w').write((m.get('videos') or [{}])[0].get('url',''))
          PY
          U=$(cat /tmp/u); echo "URL $U"
          [ -n "$U" ] && curl -s -D - -o /tmp/v.mp4 -H "$O" "$U" | grep -iE "^HTTP|access-control|content-type|content-length" && ls -la /tmp/v.mp4
