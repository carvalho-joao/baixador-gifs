name: Diagnostico CORS
on:
  push:
    paths: ['.github/workflows/diag.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in 2/status/20 i/status/20 jack/status/20 2/status/1548119328498728960; do
            printf "%s -> " "$p"; curl -s -o /tmp/r.json -w "%{http_code} " "https://api.fxtwitter.com/$p"; head -c 160 /tmp/r.json; echo
          done
          echo "--- busca por GIF recente"
          curl -s "https://api.fxtwitter.com/2/profile/Twitter/statuses?count=40" -o /tmp/tl.json -w "%{http_code}\n"; head -c 200 /tmp/tl.json; echo
          curl -s "https://api.fxtwitter.com/2/profile/giphy/statuses" -o /tmp/g.json -w "%{http_code}\n"
          python3 - <<'PY' || true
          import json
          for f in ['/tmp/tl.json','/tmp/g.json']:
              try: d=json.load(open(f))
              except Exception as e: print(f,'ERR',e); continue
              print(f, list(d.keys())[:8])
              res=d.get('results') or d.get('statuses') or []
              n=0
              for s in res:
                  for v in ((s.get('media') or {}).get('videos') or []):
                      print('FOUND', v.get('type'), s.get('id'), v.get('url')); n+=1
                  if n>4: break
          PY
